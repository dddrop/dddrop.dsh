# Custom patch layer for the DeepSeek Harness Web profile.
#
# Keep this file as a top-level array of Cordis loader patch entries. Add
# id-targeted configuration overrides, disabled flags, or inserted plugin rows.
- insert:
    - id: dddrop-theme-blue
      name: '@dddrop/dsh-plugin-theme-blue'
    - id: dddrop-pavo
      name: '@dddrop/dsh-plugin-pavo'
      config:
        repositoryPath: !!js "process.env.PAVO_REPOSITORY_PATH ?? process.env.KANBAN_REPOSITORY_PATH ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), 'Development', 'dddrop.dsh.data')"
        dataDirectory: kanban
        branch: main
        remote: origin
        autoPull: true
        autoPush: true
        initializeRepository: false
        pollIntervalMs: 3000
        pullIntervalMs: 5000
